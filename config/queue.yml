default: &default
  dispatchers:
    - polling_interval: 1
      batch_size: 500
  workers:
    - queues: "*"
      threads: 3
      processes: <%= ENV.fetch("JOB_CONCURRENCY", 1) %>
      polling_interval: 1

development:
  <<: *default

test:
  <<: *default

# CPU/memory on the production instance are limited and shared with the web
# server (Solid Queue's supervisor runs in-process there — see
# SOLID_QUEUE_IN_PUMA in render.yaml). The only job is the hourly
# SyncRecentGamesJob, so there's no need to wake up and hit the queue
# database every second around the clock; a slower poll and a single
# worker thread are still plenty responsive for that cadence and leave more
# headroom for actual web requests.
production:
  dispatchers:
    - polling_interval: 30
      batch_size: 500
  workers:
    - queues: "*"
      threads: 1
      processes: <%= ENV.fetch("JOB_CONCURRENCY", 1) %>
      polling_interval: 30
