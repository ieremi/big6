# 東京六大学's entrants in the 大学の部 of the 明治神宮野球大会, every year it was
# held (1970 on; none in 1988 or 2020), for the article at /articles/jingu-big6-record
# (JinguBig6Record). Checked 2026-11-22, through the 2026 tournament (明治大's
# part in it over).
#
# entrants: the 東京六大学 universities that played (more than one in 1972, 1975
#   and 1976, when the league had more places), from Wikipedia's table of every
#   tournament's entrants (wikipedia: below), with how far each went: champion
#   (★ there), runner_up (●), semifinal (△▽, the other two of the last four),
#   or early (out before the semifinals).
# games: each of the entrant's games, from 2013 on, as the 日本学生野球協会's
#   schedule pages give them (association: below; runs are the entrant's).
sources:
  wikipedia:
    name: Wikipedia「明治神宮野球大会」歴代結果（大学の部）
    url: https://ja.wikipedia.org/wiki/明治神宮野球大会
