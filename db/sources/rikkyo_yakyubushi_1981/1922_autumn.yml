# 原本どうしで食い違うところ。値は印刷のまま書き起こしてあり、どちらが正しいかはわからない。
discrepancies:
  - where: games[3].totals.rikkio
    note: >-
      慶應1回戦の立教の四死球と失策。選手の合計は四死球3・失策1、合計行は4・2。
      チーム攻撃成績の立教の四死球15は、各試合の選手の合計（この試合を3とする）と合う。
  - where: games[6].extras.三塁打
    note: 早稲田2回戦の三塁打の「木下」。早稲田の成績表に木下はいない（本文にも「木下の中越三塁打」とある）。
  - where: season_batting.teams.rikkio.安打
    note: 立教の安打38。8試合の成績表（立教の数字）の安打を足すと37。打数239・三振51は合う。
  - where: season_batting.teams.hosei
    note: 法政の打撃率 .183。安打53÷打撃数239＝.222 と合わない。
  - where: team_fielding.keio
    note: 慶應の守備率 .969。（151＋74）÷（151＋74＋4）＝.983 と合わない。
  - where: batting_leaders[梅田]
    note: 梅田（明）の打率 .333。安打9÷打数29＝.310 と合わない。
