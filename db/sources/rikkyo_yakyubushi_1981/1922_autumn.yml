# 大正11年（1922年）秋季リーグの立教の試合。立教大学野球部史 pp.18–20 の書き起こし。
# 形式と方針は README.md を参照。
source:
  pages: "18-20"
  # pp.18–19 のコマ。p.20 はコマ33（https://dl.ndl.go.jp/pid/12172714/1/33）。
  ndl_url: https://dl.ndl.go.jp/pid/12172714/1/32
  transcribed_on: 2026-10-12

season:
  year: 1922
  term: autumn

notes:
  - 本文によると、法政に3戦2勝し、リーグ加盟以来初めての勝ちを記録した季。
  - 本文によると、早稲田とはこの季が初めての対戦。

