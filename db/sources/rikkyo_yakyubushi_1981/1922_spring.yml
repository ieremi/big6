# 勝敗表（p.17）。この季の5大学全体のもの。columns の順に、試合数のあと各大学に対する欄、そのあと勝・分・率。
# 対戦の欄は印刷のままの文字列で、数字はその相手に勝った試合数、「：」は自校、「×」は対戦なし。
# 率は勝数÷試合数（引分を含む）で、1927年秋の勝率（勝数÷（勝数＋敗数））とは違う。
standings:
  opponents: [keio, meiji, hosei, waseda, rikkio]
  self_mark: "："
  columns: [wins, draws, average]
  average: wins_per_game
  teams:
    keio: [7, "：", "1", "2", "×", "2", 5, 0, ".714"]
    meiji: [11, "2", "：", "1", "2", "2", 7, 0, ".636"]
    hosei: [9, "0", "2", "：", "0", "2", 4, 1, ".444"]
    waseda: [5, "×", "1", "1", "：", "×", 2, 1, ".400"]
    rikkio: [6, "0", "0", "0", "×", "：", 0, 0, ".000"]
  # 表の下の「敗」の行。列の大学ごと。
  losses: { keio: 2, meiji: 4, hosei: 4, waseda: 2, rikkio: 6 }

