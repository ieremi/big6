  opponents: [meiji, keio, waseda, rikkio, hosei]
  self_mark: "："
  columns: [wins, draws, average]
  average: wins_per_game
  teams:
    meiji: [9, "：", "2", "2", "2", "2", 8, 0, ".888"]
    keio: [8, "1", "：", "×", "2", "2", 5, 0, ".625"]
    waseda: [6, "0", "×", "：", "1", "2", 3, 0, ".500"]
    rikkio: [9, "0", "1", "1", "：", "0", 2, 1, ".222"]
    hosei: [8, "0", "0", "0", "1", "：", 1, 1, ".125"]
  # 表の下の「敗」の行。列の大学ごと。
  losses: { meiji: 1, keio: 3, waseda: 3, rikkio: 6, hosei: 6 }

