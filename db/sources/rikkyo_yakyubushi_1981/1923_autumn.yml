# 勝敗表（p.25）。この季の5大学全体のもの。columns の順に、試合数のあと各大学に対する欄、そのあと勝・分・率。
# 対戦の欄は印刷のままの文字列で、数字はその相手に勝った試合数、「：」は自校、「×」は対戦なし。
# 率は勝数÷試合数（引分を含む）。明治の .888（8÷9＝.8888…）は切り捨て。
