# 原本どうしで食い違うところ。値は印刷のまま書き起こしてあり、どちらが正しいかはわからない。
discrepancies:
  - where: notes
    note: 戦績の注記は「立法二回戦」を法政棄権とするが、立法二回戦（5月20日・中野、立教 9–4）の回ごとの得点と成績表が載っている。勝敗表の立・法は互いに1勝。
  - where: games[8].totals.meiji
    note: 明治2回戦の明治の打数。選手の打数の合計は38、合計行は39。
  - where: team_fielding.meiji
    note: 明治の補助13。（211＋13）÷（211＋13＋21）＝.914 で守備率 .939 と合わない（補助113なら .939）。
  - where: team_fielding.hosei
    note: 法政の失策2。（159＋73）÷（159＋73＋2）＝.991 で守備率 .892 と合わない（失策28なら .892）。
  - where: season_batting.teams.waseda
    note: 早稲田の塁打数140は 安打88＋二塁打16＋三塁打12×2＋本塁打3×3＝137 と合わない。打撃率 .317 も 88÷281＝.313 と合わない。
  - where: season_batting.teams.meiji
    note: 明治の打撃率 .247。67÷272＝.246。
  - where: season_batting.teams.hosei
    note: 法政の塁打数59は 安打42＋二塁打13＋三塁打3×2＝61 と合わない。
  - where: season_batting.rikkio_players[荒井].打撃率
    note: 荒井の打撃率 .183。6÷32＝.188。
  - where: season_batting.rikkio_players[永田].打撃率
    note: 永田の打撃率 .113。4÷34＝.118。
  - where: season_batting.teams.rikkio.得点
    note: 立教の得点37。選手の合計は38。
  - where: season_batting.teams.rikkio.犠牲打
    note: 立教の犠牲打14。選手の合計は17。
  - where: season_batting.teams.rikkio.四死球
    note: 立教の四死球42。選手の合計は41。
  - where: season_batting.teams.rikkio.三振
    note: 立教の三振53。選手の合計は60で、9試合の成績表の立教の三振の合計（5＋4＋8＋9＋5＋10＋13＋3＋3＝60）とも合う。
  - where: season_batting.teams.rikkio.盗塁
    note: 立教の盗塁11。選手の合計は10。
  - where: batting_leaders[山崎]
    note: 山崎（早）の打率 .471。13÷27＝.481。
  - where: batting_leaders[有田]
    note: 有田（早）の打率 .421。14÷34＝.412。
