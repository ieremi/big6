# 勝敗表（p.23）。この季の5大学全体のもの。columns の順に、試合数のあと各大学に対する欄、そのあと勝・率。
# 対戦の欄は印刷のままの文字列で、数字はその相手に勝った試合数、「：」は自校、「×」は対戦なし。
# 率は法政だけ切り捨て（1÷6＝.1666… を .166）。
standings:
  opponents: [waseda, meiji, keio, rikkio, hosei]
  self_mark: "："
  columns: [wins, average]
  average: wins_per_game
  teams:
    waseda: [8, "：", "2", "×", "2", "2", 6, ".750"]
    meiji: [8, "1", "：", "2", "2", "1", 6, ".750"]
    keio: [5, "×", "0", "：", "2", "1", 3, ".600"]
    rikkio: [9, "1", "0", "0", "：", "1", 2, ".222"]
    hosei: [6, "0", "0", "0", "1", "：", 1, ".166"]
  # 表の下の「敗」の行。列の大学ごと。
  losses: { waseda: 2, meiji: 2, keio: 2, rikkio: 7, hosei: 5 }

