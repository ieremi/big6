# 原本どうしで食い違うところ。値は印刷のまま書き起こしてあり、どちらが正しいかはわからない。
discrepancies:
  - where: standings
    note: 勝敗表の立教の行の対慶應の欄が「：」（自校の印）。立教は慶應1回戦に勝っており、勝数4・慶應の敗1と合わせると「1」の誤植と思われる。
  - where: season_batting.teams.waseda
    note: 早稲田の安打89。塁打数57（＝36＋二塁打3＋三塁打9×2）と打撃率 .237（36÷152）はどちらも安打36なら合う。
  - where: season_batting.teams.hosei
    note: 法政の打撃率 .184。34÷186＝.183。
  - where: season_batting.rikkio_players[二神].塁打数
