# 大正13年（1924年）春季リーグの立教の試合。立教大学野球部史 pp.27–28 の書き起こし。
# 形式と方針は README.md を参照。
source:
  pages: "27-28"
  # p.27 のコマ。p.28 はコマ37（https://dl.ndl.go.jp/pid/12172714/1/37）。
  ndl_url: https://dl.ndl.go.jp/pid/12172714/1/36
  transcribed_on: 2026-10-12

season:
  year: 1924
  term: spring

notes:
  - 本文によると、明治が4月に渡米したため、この季は4大学の間で行われた。
  - 本文によると、この季から池袋のグラウンドでも試合が行われた（4月12日にスタンド開き）。

