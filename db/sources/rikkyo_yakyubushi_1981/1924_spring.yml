  self_mark: "："
  columns: [wins, average]
  average: wins_per_game
  teams:
    waseda: [5, "：", "×", "2", "2", 4, ".800"]
    keio: [5, "×", "：", "2", "2", 4, ".800"]
    rikkio: [8, "1", "：", "：", "2", 4, ".500"]
    hosei: [6, "0", "0", "0", "：", 0, ".000"]
  # 表の下の「敗」の行。列の大学ごと。
  losses: { waseda: 1, keio: 1, rikkio: 4, hosei: 6 }

