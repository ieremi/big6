# 大正14年（1925年）秋季リーグの立教の試合と、その前後の遠征。立教大学野球部史 pp.34–38 の書き起こし。
# 帝大が加わり、6大学のリーグになった最初の季。形式と方針は README.md を参照。
source:
  pages: "34-38"
  # p.34 のコマ。pp.35–36 はコマ40、pp.37 はコマ41、p.38 はコマ42（https://dl.ndl.go.jp/pid/12172714/1/42）。
  ndl_url: https://dl.ndl.go.jp/pid/12172714/1/40
  transcribed_on: 2026-10-12

season:
  year: 1925
  term: autumn

notes:
  - 本文によると、明治2回戦（10月13日）は東長崎の立教の球場での最初の試合で、明治の湯浅投手がノーヒット・ノーランを記録した。
  - 本文によると、法政2回戦の齋藤の本塁打は、立教が公式戦で記録した初めての本塁打。
  - 慶應1回戦の慶應の成績表の見出しは、印刷では「應慶」。

# 戦績（p.34）の順。回戦は成績表の見出し（「立教対明治一回戦」など）から。
