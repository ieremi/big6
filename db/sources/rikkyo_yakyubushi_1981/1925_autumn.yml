  - where: games[5].line_score
    note: 法政1回戦の回ごとの得点の法政の行は 111 010 100 で合計5だが、合計欄は4、戦績も「立教 6－4 法政」。
  - where: games[11].line_score
    note: 慶應3回戦は後攻の慶應が勝っているが、9回裏は「x」ではなく「0」と印刷されている。
  - where: games[4].totals.rikkio
    note: 帝大3回戦の立教の三振。選手の合計は7、合計行は8。
  - where: games[7].totals.rikkio
    note: 早稲田1回戦の立教の打数と失策。選手の合計は打数27・失策3、合計行は28・2。
  - where: games[7].totals.waseda
