# 大正14年（1925年）春季リーグの立教の試合。立教大学野球部史 pp.31–34 の書き起こし。
# 形式と方針は README.md を参照。
source:
  pages: "31-34"
  # p.31 のコマ。pp.32–33 はコマ39、p.34 はコマ40（https://dl.ndl.go.jp/pid/12172714/1/40）。
  ndl_url: https://dl.ndl.go.jp/pid/12172714/1/38
  transcribed_on: 2026-10-12

season:
  year: 1925
  term: spring

notes:
  - 戦績の注記「※春季リーグ戦は雨にたたられて日程が延び、そのうえ明大のハワイ遠征が迫っていたため、明立決勝戦、早明決勝戦を行なうことができなかった。」
  - 本文（p.31「六大学リーグ結成」）によると、この春の帝大との試合は試験的に各校と一回戦を行ったもので、帝大が正式にスケジュールに組み込まれたのは秋から。帝大戦は戦績に載っているが勝敗表には入っていないため、other_games に入れた。
  - 慶應と早稲田はこの季も対戦していない（勝敗表の早・慶は ×）。

