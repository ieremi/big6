  opponents: [meiji, waseda, keio, rikkio, hosei]
  self_mark: "："
  columns: [wins, draws, average]
  average: wins_per_decision
  teams:
    meiji: [8, "：", "1", "2", "1", "2", 6, 1, ".857"]
    waseda: [5, "0", "：", "×", "2", "1", 3, 1, ".750"]
    keio: [6, "0", "×", "：", "2", "2", 4, 0, ".667"]
    rikkio: [8, "1", "0", "0", "：", "2", 3, 0, ".375"]
    hosei: [7, "0", "0", "0", "0", "：", 0, 0, ".000"]
  # 表の下の「敗数」の行。列の大学ごと。
