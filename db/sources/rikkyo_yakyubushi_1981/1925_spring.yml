# 勝敗表（p.34）。この季の5大学のもの。columns の順に、試合数のあと各大学に対する欄、そのあと勝・分・率。
# 対戦の欄は印刷のままの文字列で、数字はその相手に勝った試合数、「：」は自校、「×」は対戦なし。
# 率は勝数÷（勝数＋敗数）で、引分を除く（明治 6÷7＝.857）。
