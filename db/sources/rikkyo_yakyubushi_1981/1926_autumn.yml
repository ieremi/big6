# 原本どうしで食い違うところ。値は印刷のまま書き起こしてあり、どちらが正しいかはわからない。
discrepancies:
  - where: games[3].extras
    note: 明治2回戦と3回戦の注記の本塁打（永澤）・三塁打（林）・二塁打（錢村、南條）が同じ。盗塁・犠打は違う。3回戦の本文には「五回中澤の中越ホームラン」とある。
  - where: standings.tokyo.率
    note: 帝大の率 .169。2÷（2＋10）＝.167。
  - where: season_batting.teams.tokyo.打撃率
    note: 帝大の打撃数300。56÷300＝.187 で打撃率 .1474 と合わない（56÷380なら .1474）。
  - where: team_fielding.waseda
    note: 早稲田の守備率 .9511。（384＋205）÷（384＋205＋25）＝.9593。
