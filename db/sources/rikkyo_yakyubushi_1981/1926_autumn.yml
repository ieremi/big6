# 大正15年（1926年）秋季リーグの立教の試合。立教大学野球部史 pp.43–46 の書き起こし。
# 形式と方針は README.md を参照。
source:
  pages: "43-46"
  # p.43 のコマ。pp.44–45 はコマ45、p.46 はコマ46（https://dl.ndl.go.jp/pid/12172714/1/46）。
  ndl_url: https://dl.ndl.go.jp/pid/12172714/1/44
  transcribed_on: 2026-10-13

season:
  year: 1926
  term: autumn

notes:
  - 本文によると、帝大2回戦（11月4日）は、この秋に竣工した神宮球場での立教の最初の試合。
  - 本文によると、帝大3回戦は7回が終わったところで降雨コールドゲームとなった。

