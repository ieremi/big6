# 大正15年（1926年）春季リーグの立教の試合。立教大学野球部史 pp.38–42 の書き起こし。
# 形式と方針は README.md を参照。
source:
  pages: "38-42"
  # pp.38–39 のコマ。pp.40–41 はコマ43、p.42 はコマ44（https://dl.ndl.go.jp/pid/12172714/1/44）。
  ndl_url: https://dl.ndl.go.jp/pid/12172714/1/42
  transcribed_on: 2026-10-13

season:
  year: 1926
  term: spring

notes:
  - 本文（p.38「初のAクラス入り」）によると、立教はこの季2位で、リーグ加盟以来初めてAクラスに入った。
  - 本文によると、早稲田3回戦の勝利は立教が早稲田から挙げた初めての勝ち点。

