# 勝敗表（p.53）。この季の6大学全体のもの。立教の14試合は p.50 の戦績の試合数と合う。
# columns は 試合・対明大・対慶大・対早大・対帝大・対法大・対立大・勝数・引分・勝点・勝率（行と列の大学の順は印刷のまま）。
# 対戦の欄は印刷のままの文字列で、数字はその相手に勝った試合数、△は引分1試合、×は自校。勝率は勝数÷（勝数＋敗数）を四捨五入。
standings:
  # 対戦の欄の大学の順。
  opponents: [meiji, keio, waseda, tokyo, hosei, rikkio]
  self_mark: "×"
  columns: [wins, draws, points, average]
  average: wins_per_decision
  teams:
    meiji: [15, "×", "1△", "2", "2△", "2△", "2△", 9, 4, 4, ".818"]
    keio: [13, "2△", "×", "2", "2", "1", "2", 9, 1, 4, ".750"]
    waseda: [11, "0", "0", "×", "2", "2△", "2", 6, 1, 3, ".600"]
    tokyo: [13, "0△", "0", "0", "×", "2△", "2", 4, 2, 2, ".364"]
    hosei: [18, "0△", "2", "0△", "1△", "×", "1△△", 4, 5, 1, ".308"]
    rikkio: [14, "0△", "0", "0", "0", "2△△", "×", 2, 3, 1, ".182"]
  # 表の下の「敗数」の行。列の大学ごと。
  losses: { meiji: 2, keio: 3, waseda: 4, tokyo: 7, hosei: 9, rikkio: 9 }

# チーム守備成績（p.53）。印刷の順。columns は 試合・刺殺・捕殺・失策・比率。
# 比率は（刺殺＋捕殺）÷（刺殺＋捕殺＋失策）の小数点以下4桁で、四捨五入ではなく切り捨て（明大と帝大でわかる）。
