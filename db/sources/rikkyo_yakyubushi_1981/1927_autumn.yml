# 勝敗表（p.53）。この季の6大学全体のもの。立教の14試合は p.50 の戦績の試合数と合う。
# columns は 試合・対明大・対慶大・対早大・対帝大・対法大・対立大・勝数・引分・勝点・勝率（行と列の大学の順は印刷のまま）。
# 対戦の欄は印刷のままの文字列で、数字はその相手に勝った試合数、△は引分1試合、×は自校。勝率は勝数÷（勝数＋敗数）を四捨五入。
