# 原本どうしで食い違うところ。値は印刷のまま書き起こしてあり、どちらが正しいかはわからない。
discrepancies:
  - where: games[9].date
    note: 帝大1回戦の日付。戦績では十月十七日で、法政1回戦（games[6]）と同じ日になっている。
  - where: games[4].totals.rikkio
    note: 明治1回戦の立教の打数。選手の打数の合計は33、合計行は38。ほかの列は合う。
  - where: games[4].totals.meiji
    note: 明治1回戦の明治の四死球。選手の合計は3、合計行は4。ほかの列は合う。
  - where: games[4].batting.rikkio[高瀬]
    note: 明治1回戦の高瀬の守備位置は「(折)」と印刷されている。「(打)」の誤植と思われる。
  - where: games[6].totals.rikkio
    note: 法政1回戦の立教の打数。大内の打数が6と印刷されていて、選手の合計は35、合計行は29（大内が0なら合う）。
