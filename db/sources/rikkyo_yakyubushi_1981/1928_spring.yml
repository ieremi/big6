# 原本どうしで食い違うところ。値は印刷のまま書き起こしてあり、どちらが正しいかはわからない。
discrepancies:
  - where: games[1].totals.waseda
    note: 早稲田2回戦の早稲田の打数。選手の打数の合計は29、合計行は27。
  - where: games[1].totals.rikkio
    note: 早稲田2回戦の立教の打数。選手の打数の合計は33、合計行は36。
  - where: year_batting.rikkio_players[片田]
    note: 塁打数20。安打11＋二塁打2＋三塁打2×2＝17（本塁打0）と合わない。ほかの選手と列の合計（76）は合う。
  - where: games[2].extras.本塁打
    note: 帝大1回戦で渡部が本塁打（本文と注記）。しかし年間のチーム打撃成績では立教の本塁打は0で、個人打撃成績にも渡部はない。
  - where: games[3].batting.rikkio[山本]
    note: 帝大2回戦の「(一)山本」。部員の名簿に山本はなく、捕手の山木貞夫の誤植の可能性がある。
  - where: year_batting.teams.meiji
    note: 明治の打率 .180。安打95÷打撃数525＝.1810 で、ほかの大学のように四捨五入すると .181。
