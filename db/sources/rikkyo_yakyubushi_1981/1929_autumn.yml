# 昭和4年（1929年）秋季リーグの立教の試合。立教大学野球部史 pp.65–68 の書き起こし。
# 形式と方針は README.md を参照。
source:
  pages: "65-68"
  # p.65 のコマ。pp.66–67 はコマ56（https://dl.ndl.go.jp/pid/12172714/1/56）、p.68 はコマ57
  # （https://dl.ndl.go.jp/pid/12172714/1/57）。
  ndl_url: https://dl.ndl.go.jp/pid/12172714/1/55
  transcribed_on: 2026-10-29

season:
  year: 1929
  term: autumn

notes:
  - 球場は対早稲田一回戦（戸塚）を除き全て神宮球場（p.65 の注記）
  - 明治一回戦は延長十回、8対8で引分

# 戦績（p.65）の順。round は回戦で、成績表の見出し（「立教対明治一回戦」など）にある。明治とは引分があって4試合。
# top は先攻（回ごとの得点の上の行）、bottom は後攻。
# 成績表は「打・安・四・三・失」の順に印刷されている。ここではほかの季と同じ [打, 安, 三, 四, 失] の順に
