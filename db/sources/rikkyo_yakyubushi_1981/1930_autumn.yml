# 昭和5年（1930年）秋季リーグの立教の試合。立教大学野球部史 pp.73–77 の書き起こし。
# 形式と方針は README.md を参照。この年の部員とその他の戦績は 1930_spring.yml にある。
source:
  pages: "73-77"
  # 戦績は p.73（コマ59）と p.74。pp.74–75 はコマ60（https://dl.ndl.go.jp/pid/12172714/1/60）、pp.76–77 はコマ61
  # （https://dl.ndl.go.jp/pid/12172714/1/61）。チーム打撃成績・個人打撃成績・チーム守備成績・打撃ベストテンは、
  # 翌年（昭和6年）の最初のページの p.77 にある。
  ndl_url: https://dl.ndl.go.jp/pid/12172714/1/59
  transcribed_on: 2026-11-03

season:
  year: 1930
  term: autumn

notes:
  - 球場は全て神宮球場（p.73–74 の戦績）
  - 明治二回戦は延長十四回
  - 法政が初優勝（p.76 の見出し「法政初優勝」）

# 戦績（p.73–74）の順。round は回戦で、成績表の見出し（「立教対慶應一回戦」など）にある。
# top は先攻（回ごとの得点の上の行）、bottom は後攻。
# 成績表の列の順は試合によって違う。慶應二回戦、早稲田一回戦、法政三回戦は「打・安・三・四・失」、ほかは「打・安・四・三・失」の
# 順に印刷されている。ここではほかの季と同じ [打, 安, 三, 四, 失] の順に並べ替えた（totals も同じ）。
# 慶應三回戦の立教の山城は「（中）」と印刷されている（ほかの試合では一塁）。
