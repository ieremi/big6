# 昭和5年（1930年）春季リーグの立教の試合。立教大学野球部史 pp.69–73 の書き起こし。
# 形式と方針は README.md を参照。
source:
  pages: "69-73"
  # p.69 のコマ。pp.70–71 はコマ58（https://dl.ndl.go.jp/pid/12172714/1/58）、pp.72–73 はコマ59
  # （https://dl.ndl.go.jp/pid/12172714/1/59）。
  ndl_url: https://dl.ndl.go.jp/pid/12172714/1/57
  transcribed_on: 2026-11-03

season:
  year: 1930
  term: spring

notes:
  - 球場は全て神宮球場（p.69 の戦績）
  - 慶應二回戦は4対4で引分、慶應三回戦は延長十三回
  - 帝大三回戦の日付は戦績に「五月十九日」と印刷され、二回戦（四月二十七日）のすぐ後に並んでいる

# 戦績（p.69）の順。戦績は相手ごとにまとまっていて、日付の順ではない。round は回戦で、成績表の見出し
# （「立教対法政一回戦」など）にある。慶應とは引分があって4試合。
# top は先攻（回ごとの得点の上の行）、bottom は後攻。帝大二回戦の帝大の4回は11点で、(11) と書く。
# 法政一回戦・二回戦の成績表は「打・安・四・三・失」の順に印刷されている。ここではほかの季と同じ
# [打, 安, 三, 四, 失] の順に並べ替えた（totals も同じ）。明治一回戦からは「打・安・三・四・失」の順の印刷。
