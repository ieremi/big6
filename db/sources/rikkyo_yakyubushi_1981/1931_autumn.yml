# 原本どうしで食い違うところ。値は印刷のまま書き起こしてあり、どちらが正しいかはわからない。
discrepancies:
  - where: games[2].extras.二塁打
    note: 慶應1回戦の二塁打は「百瀬、」と読点で終わっていて、ほかの名前は印刷されていない。
  - where: games[4].totals.hosei
    note: 法政1回戦の法政の打数。選手の合計は35、合計行は29。
  - where: games[8].totals.rikkio
    note: 明治2回戦の立教の打数。選手の合計は38、合計行は37。
  - where: standings
    note: 帝大の行の対明大の欄は0だが、帝大の勝数4（対早1・対法2では3）と明大の敗数5（ほかの欄の合計は4）は、帝大が明大に1勝していれば合う。
  - where: season_batting.teams.tokyo.塁打数
    note: 帝大の安打79。塁打数92（＝安打＋二塁打7＋三塁打4×2）と打撃率 .196（÷393）はどちらも安打77なら合う。
  - where: season_batting.teams.tokyo.打撃率
    note: 帝大の打撃率 .196。79÷393＝.201（77÷393なら .196）。
  - where: season_batting.rikkio_players[中島].打撃率
    note: 中島の打率 .313。14÷45＝.311 で、打撃ベストテンでは .311。
  - where: season_batting.rikkio_players[辻].打撃率
    note: 辻の行は打撃数21・得点21・安打1・塁打数5・打率 .233 と印刷されていて、互いに合わない（列がずれている可能性がある）。
  - where: season_batting.rikkio_players[辻].塁打数
    note: 辻の塁打数5。安打1からは1。
  - where: season_batting.rikkio_players[關口].打撃率
    note: 關口の打率 .174。6÷35＝.171。
  - where: season_batting.rikkio_players[畑中].打撃率
    note: 畑中の打率 .108。2÷30＝.067。
  - where: season_batting.rikkio_players[菊谷].打撃率
    note: 菊谷の安打2。塁打数9（＝安打＋三塁打1×2）と打率 .412（÷17）はどちらも安打7なら合う。
  - where: season_batting.rikkio_players[菊谷].塁打数
    note: 菊谷の塁打数9。安打2＋三塁打1×2＝4。
  - where: team_fielding.keio
    note: 慶應の守備率 .965。（331＋170）÷（331＋170＋13）＝.975。
