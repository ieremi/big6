# 昭和6年（1931年）秋季リーグの立教の試合。立教大学野球部史 pp.81–85 の書き起こし。
# 形式と方針は README.md を参照。その他の戦績（p.85。新人戦や聖ポール軍の試合など）は書き起こしていない。
source:
  pages: "81-85"
  # p.81 のコマ。pp.82–83 はコマ64（https://dl.ndl.go.jp/pid/12172714/1/64）、pp.84–85 はコマ65
  # （https://dl.ndl.go.jp/pid/12172714/1/65）。
  ndl_url: https://dl.ndl.go.jp/pid/12172714/1/63
  transcribed_on: 2026-11-05

season:
  year: 1931
  term: autumn

notes:
  - 球場は全て神宮球場
  - 立教がリーグ初優勝（p.81「初優勝を飾る」）

# 戦績（p.81）の順。round は回戦で、成績表の見出し（「立教対早稲田一回戦」など）にある。
# top は先攻（回ごとの得点の上の行）、bottom は後攻。成績表は全て「打・安・三・四・失」の順の印刷
# （早稲田一回戦の早稲田の見出しは「打安三四失失」と印刷されているが、数字は5列）。
# 法政一回戦の法政の島・武田・藤井は3人とも「（右）」と印刷されている。
