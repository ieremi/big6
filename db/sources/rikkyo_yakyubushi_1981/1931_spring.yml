  opponents: [keio, waseda, rikkio, tokyo, meiji]
  self_mark: "×"
  columns: [wins, draws, points, average]
  average: wins_per_decision
  teams:
    keio: [9, "×", "1", "2", "2", "2", 7, 0, 3, ".778"]
    waseda: [10, "2", "×", "2", "2", "0", 6, 0, 3, ".600"]
    rikkio: [7, "0", "1", "×", "2", "×", 3, 0, 1, ".429"]
    tokyo: [6, "0", "0", "0", "×", "×", 0, 0, 0, ".000"]
    meiji: [4, "0", "2", "×", "×", "×", 2, 0, 1, ".500"]
