# 昭和7年（1932年）秋季リーグの立教の試合。立教大学野球部史 pp.88–92 の書き起こし。
# 形式と方針は README.md を参照。p.92 のその他の戦績（ミシガン大戦）は書き起こしていない。
# 1932年春季は立教がアメリカ遠征で出場せず（p.86 の勝敗表に「立大渡米」）、立教の試合がないので書き起こしていない。
source:
  pages: "88-92"
  # p.88 のコマ。pp.90–91 はコマ68（https://dl.ndl.go.jp/pid/12172714/1/68）、p.92 はコマ69
  # （https://dl.ndl.go.jp/pid/12172714/1/69）。
  ndl_url: https://dl.ndl.go.jp/pid/12172714/1/67
  transcribed_on: 2026-11-10

season:
  year: 1932
  term: autumn

notes:
  - 戦績に球場の記載はない。この頃のリーグ戦は全て神宮球場なので venue は神宮とした
  - 菊谷が打率 .370 で立教初の首位打者（p.92「菊谷、立教初の首位打者」）

# 戦績（p.88）の順。round は回戦で、成績表の見出し（「立教対早稲田一回戦」など）にある。
# top は先攻（回ごとの得点の上の行）、bottom は後攻。成績表の列の順は試合ごとに違い、早稲田三回戦・明治二回戦・
# 帝大二回戦は「打・安・三・四・失」、ほかは「打・安・四・三・失」の印刷。どちらも [打, 安, 三, 四, 失] の順に直してある。
# 立教の宇田村は、法政一回戦・慶應一回戦の成績表と明治二回戦の二塁打では「宇多村」と印刷されている。
