# 昭和8年（1933年）秋季リーグの立教の試合。立教大学野球部史 pp.93, 95–98 の書き起こし。
# 形式と方針は README.md を参照。p.99 のその他の戦績は書き起こしていない。
# 1933年は一シーズン制で、各校と春に1試合（1933_spring.yml）、秋に2試合を行い、勝敗表は春秋を通したもの
# （p.93 本文「一シーズン制になったこの最初の年」、立教は11勝3敗1分）。そのため秋の試合の回戦は二回戦・三回戦で、
# 勝敗表・チーム守備率・打撃ベストテン・チーム打撃成績・立教の個人打撃成績（p.98）も年間（15試合）のもの。
source:
  pages: "93, 95-98"
  # p.93（戦績）のコマ。p.95 はコマ70（https://dl.ndl.go.jp/pid/12172714/1/70）、pp.96–97 はコマ71
  # （https://dl.ndl.go.jp/pid/12172714/1/71）、p.98 はコマ72（https://dl.ndl.go.jp/pid/12172714/1/72）。
  ndl_url: https://dl.ndl.go.jp/pid/12172714/1/69
  transcribed_on: 2026-11-13

season:
  year: 1933
  term: autumn

notes:
  - 戦績に球場の記載はない。この頃のリーグ戦は全て神宮球場なので venue は神宮とした
  - 明治二回戦（10月17日）で立教の二度目の優勝が決まった（p.97「二度目の優勝を決める」）

# 戦績（p.93）の順（慶應三回戦の10月25日が明治戦より前に載っている）。round は回戦で、成績表の見出し
# （「立教対法政二回戦」など）にある。top は先攻（回ごとの得点の上の行）、bottom は後攻。
# 成績表の列の順は、法政・帝大・早稲田二回戦は「打・安・三・四・失」、早稲田三回戦・慶應・明治は「打・安・四・三・失」の
# 印刷。どちらも [打, 安, 三, 四, 失] の順に直してある。
