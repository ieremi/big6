# 原本どうしで食い違うところ。値は印刷のまま書き起こしてあり、どちらが正しいかはわからない。
discrepancies:
  - where: games[0].batting.rikkio
    note: 法政一回戦の立教は、山崎と宇田村がどちらも「左」で、右翼手がいない（途中出場の菊地・古岩井も「左」）。
  - where: games[1].batting.rikkio
    note: 明治一回戦の立教は、杉田と内田がどちらも「三」で、遊撃手がいない。
  - where: games[3].totals.rikkio
    note: 帝大一回戦の立教の打数。選手の合計は35、合計行は36。
  - where: games[3].totals.tokyo
    note: 帝大一回戦の帝大の打数。選手の合計は30、合計行は27。
  - where: games[4].line_score
    note: 慶應一回戦は後攻の慶應が9-6で勝っているが、回ごとの得点の9回裏は「x」ではなく「0」と印刷されている。
