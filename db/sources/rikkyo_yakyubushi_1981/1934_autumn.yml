# 昭和9年（1934年）秋季リーグの立教の試合。立教大学野球部史 pp.99, 101–104 の書き起こし。
# 形式と方針は README.md を参照。p.99 のその他の戦績は書き起こしていない。
# 1934年は1933年と同じく一シーズン制で、各校と春に1試合（1934_spring.yml）、秋に2試合を行い、勝敗表は春秋を通したもの。
# そのため秋の試合の回戦は二回戦・三回戦で、勝敗表・打撃ベストテン・立教の個人打撃成績（p.104）も年間（15試合）のもの。
# この年はチーム打撃成績とチーム守備成績の表はない。
source:
  pages: "99, 101-104"
  # p.99（戦績）のコマ。p.101 はコマ73（https://dl.ndl.go.jp/pid/12172714/1/73）、pp.102–103 はコマ74
  # （https://dl.ndl.go.jp/pid/12172714/1/74）、p.104 はコマ75（https://dl.ndl.go.jp/pid/12172714/1/75）。
  ndl_url: https://dl.ndl.go.jp/pid/12172714/1/72
  transcribed_on: 2026-11-14

season:
  year: 1934
  term: autumn

notes:
  - 戦績に球場の記載はない。この頃のリーグ戦は全て神宮球場なので venue は神宮とした

# 戦績（p.99）の順（早稲田戦の10月18日・25日が明治戦の10月14日・15日より前に載っている）。round は回戦で、
