# 昭和10年（1935年）秋季リーグの立教の試合。立教大学野球部史 pp.108–111 の書き起こし。
# 形式と方針は README.md を参照。p.110 のその他の戦績は書き起こしていない。
# 春季と同じく各校と2試合ずつで、勝敗表は引分を双方 0.5 勝として数えている。
