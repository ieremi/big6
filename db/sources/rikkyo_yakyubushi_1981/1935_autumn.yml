  - where: games[0].totals.meiji
    note: 明治一回戦の明治の打数。選手の合計は35、合計行は34。
  - where: games[1].totals.meiji
    note: 明治二回戦の明治の四球。選手の合計は7、合計行は9。
  - where: games[2].extras.犠打
    note: 早稲田一回戦の犠打は「▽犠打 2」で、どちらの大学かの記載がない。
  - where: games[4].totals.rikkio
    note: 帝大一回戦の立教の打数。選手の合計は42、合計行は41。
  - where: games[4].totals.tokyo
    note: 帝大一回戦の帝大の打数。選手の合計は31、合計行は39。
  - where: games[9].extras.二塁打
    note: 慶應二回戦の二塁打に「秋山」とあるが、両軍の成績表に秋山はいない（秋山は法政の選手）。
  - where: standings.tokyo.得点
    note: 帝大の得点は「1」と印刷されているが、1勝1引分なら1.5で、勝率.150とも合う。
  - where: season_batting.rikkio_players[杉田].塁打数
    note: 杉田の塁打数12。安打10で長打はないので10。
  - where: batting_leaders[長野]
    note: 長野の試合数は「15」と印刷されている。この季は各校10試合。
