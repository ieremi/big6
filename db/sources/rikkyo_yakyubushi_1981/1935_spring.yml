# 昭和10年（1935年）春季リーグの立教の試合。立教大学野球部史 pp.104–107 の書き起こし。
# 形式と方針は README.md を参照。この年から再び春秋の二シーズン制（p.104「再び二シーズン制に」）。
# 春季は各校と2試合ずつで、1勝1敗になっても決勝戦（3回戦）は行わなかった（p.104）。
source:
  pages: "104-107"
  # p.104 のコマ。p.105 もコマ75、pp.106–107 はコマ76（https://dl.ndl.go.jp/pid/12172714/1/76）。
  ndl_url: https://dl.ndl.go.jp/pid/12172714/1/75
  transcribed_on: 2026-11-15

season:
  year: 1935
  term: spring

notes:
  - 戦績に球場の記載はない。この頃のリーグ戦は全て神宮球場なので venue は神宮とした

# 戦績（p.104）の順。round は回戦で、成績表の見出し（「立教対帝大一回戦」など）にある。
# top は先攻（回ごとの得点の上の行）、bottom は後攻。成績表の列はどれも「打・安・三・四・失」の印刷。
