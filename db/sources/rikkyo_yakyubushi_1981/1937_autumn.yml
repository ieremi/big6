# 昭和12年（1937年）秋季リーグの立教の試合。立教大学野球部史 pp.122–125 の書き起こし。
# 形式と方針は README.md を参照。この季はチーム打撃・守備成績や個人打撃成績の表がなく、勝敗表（p.125）だけ。
# 各校と2試合ずつで、勝敗表は引分を双方 0.5 勝として数えている。部員は春季のファイル（1937_spring.yml）にある。
source:
  pages: "122-125"
  # p.122 のコマ。p.123 も同じコマ、pp.124–125 はコマ85（https://dl.ndl.go.jp/pid/12172714/1/85）。
  ndl_url: https://dl.ndl.go.jp/pid/12172714/1/84
  transcribed_on: 2026-11-26

season:
  year: 1937
  term: autumn

notes:
  - 戦績に球場の記載がないので、どの試合も神宮とした

# 戦績（p.122）の順。round は回戦で、成績表の見出し（「立教対早稲田一回戦」など）にある。
