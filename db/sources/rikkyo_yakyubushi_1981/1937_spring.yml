# 昭和12年（1937年）春季リーグの立教の試合。立教大学野球部史 pp.119–122 の書き起こし。
# 形式と方針は README.md を参照。部員（p.119）も書き起こした。
# 各校と2試合ずつで、勝敗表は引分を双方 0.5 勝として数えている。
