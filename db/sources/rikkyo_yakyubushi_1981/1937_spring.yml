  pages: "119-122"
  # p.119 のコマ。pp.120–121 はコマ83（https://dl.ndl.go.jp/pid/12172714/1/83）、p.122 はコマ84
  # （https://dl.ndl.go.jp/pid/12172714/1/84）。
