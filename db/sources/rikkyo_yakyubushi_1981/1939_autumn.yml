# 昭和14年（1939年）秋季リーグの立教の試合。立教大学野球部史 pp.136–139 の書き起こし。
# 形式と方針は README.md を参照。BIG6 Scorebook は1938年秋季のあと1946年春季までの試合がないので、その間の季も書き起こしている。
# p.136 の前半（個人打撃成績・チーム守備成績）は1939年春季のもので、1939_spring.yml にある。部員も春季のファイルにある。
# 勝敗表は p.138、個人打撃成績・チーム打撃成績・チーム守備成績は p.139（1940年の見出しの前）にある。
# 各校と2試合ずつで、勝敗表は引分を双方 0.5 勝として数えている。
source:
  pages: "136-139"
  # p.136 のコマ。p.137 も同じコマ、pp.138–139 はコマ92（https://dl.ndl.go.jp/pid/12172714/1/92）。
  ndl_url: https://dl.ndl.go.jp/pid/12172714/1/91
  transcribed_on: 2026-11-28

season:
  year: 1939
  term: autumn

notes:
  - 戦績に球場の記載がないので、どの試合も神宮とした
  - 勝敗表の下に「慶早同率にて優勝決定戦を行ない慶大優勝」とある（立教の試合ではないので書き起こしていない）

