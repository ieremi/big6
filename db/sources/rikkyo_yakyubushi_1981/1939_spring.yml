# 昭和14年（1939年）春季リーグの立教の試合。立教大学野球部史 pp.132–135 の書き起こし。
# 形式と方針は README.md を参照。BIG6 Scorebook は1938年秋季のあと1946年春季までの試合がないので、その間の季も書き起こしている。
# p.132 の前半（勝敗表・その他の戦績）は1938年秋季のもので、Scorebook にあるので書き起こしていない。
# この季は個人打撃成績の表がなく、勝敗表とチーム打撃成績（p.135）だけ。
# 各校と2試合ずつで、勝敗表は引分を双方 0.5 勝として数えている。
source:
  pages: "132-135"
  # p.132 のコマ。p.133 も同じコマ、pp.134–135 はコマ90（https://dl.ndl.go.jp/pid/12172714/1/90）。
  ndl_url: https://dl.ndl.go.jp/pid/12172714/1/89
  transcribed_on: 2026-11-27

season:
  year: 1939
  term: spring

notes:
  - 戦績に球場の記載がないので、どの試合も神宮とした
  - 勝敗表の下に「早慶同率にて優勝決定戦を行ない早大優勝」とある（立教の試合ではないので書き起こしていない）

