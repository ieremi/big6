databases:
  - name: big6-db
    plan: 0.1c-256mb
    region: singapore

services:
  - type: web
    name: big6
    runtime: docker
    plan: 0.5c-512mb
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /up
    envVars:
      - key: RAILS_MASTER_KEY
        sync: false
      # Signing in to the admin pages with Google (config/initializers/omniauth.rb):
      # the OAuth client's id and secret, and the addresses that may sign in as
      # admins, comma separated (LoginPolicy). Entered in the Render dashboard.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      # Without this, Puma never boots the Solid Queue supervisor, so nothing
      # in config/recurring.yml (and no other ActiveJob job) ever actually
      # runs — jobs get enqueued but nothing dequeues them. There's only one
      # web service here (no separate worker), so run the supervisor
      # in-process inside Puma instead.
      - key: SOLID_QUEUE_IN_PUMA
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: big6-db
          property: connectionString
      # solid_cache/solid_queue/solid_cable each need their own physical database
      # (sharing one with primary breaks schema loading, since they'd share one
      # schema_migrations table). Create big6-db-cache/-queue/-cable as extra
      # databases on the same Postgres instance, then set these manually in the
      # Render dashboard to that instance's connection string with the database
      # name swapped for each. sync: false leaves them blank here so Render
      # prompts for manual entry instead of reusing the primary connection string.
      - key: CACHE_DATABASE_URL
        sync: false
      - key: QUEUE_DATABASE_URL
        sync: false
      - key: CABLE_DATABASE_URL
        sync: false
