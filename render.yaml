databases:
  - name: big6-db
    plan: 0.1c-256mb
    region: singapore

services:
  - type: web
    name: big6
    runtime: docker
    plan: 0.5c-512mb
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /up
    envVars:
      - key: RAILS_MASTER_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: big6-db
          property: connectionString
      - key: CACHE_DATABASE_URL
        fromDatabase:
          name: big6-db
          property: connectionString
      - key: QUEUE_DATABASE_URL
        fromDatabase:
          name: big6-db
          property: connectionString
      - key: CABLE_DATABASE_URL
        fromDatabase:
          name: big6-db
          property: connectionString
      - key: SOLID_QUEUE_IN_PUMA
        value: "true"
